name: Workflows

on:
  pull_request:
    branches:
      - main
      - master
  push:
    branches:
      - main
      - master

permissions:
  contents: read

# A new push to the same PR or branch cancels the run still in progress.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: 🔎 Lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: 📥 Checkout Source Code
        uses: actions/checkout@v4

      - name: 🛠 Setup Go (from go.mod) with cache
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: 📦 Check go.mod and go.sum are tidy
        run: go mod tidy -diff

      # Also checks gofmt and gosec (see .golangci.yml).
      - name: ✅ Run golangci-lint
        uses: golangci/golangci-lint-action@v7
        with:
          version: v2.14.0
          args: ./...
          only-new-issues: false

  test:
    name: ✅ Tests & Coverage
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: 📥 Checkout Source Code
        uses: actions/checkout@v4

      - name: 🛠 Setup Go (from go.mod) with cache
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: 🧪 Run Unit Tests with Race Detector and Coverage
        run: |
          go test -race -covermode=atomic -coverprofile=coverage.out \
            $(go list ./... | grep -v -E '/(cmd|docs|tests)')

      - name: 🧪 Run E2E Tests
        run: go test -race ./tests/...

      - name: 📊 Enforce Coverage Threshold (70%)
        run: |
          total=$(go tool cover -func=coverage.out | awk '/^total:/ { sub("%", "", $3); print $3 }')
          echo "Total coverage: ${total}%"
          echo "### Coverage: ${total}%" >> "$GITHUB_STEP_SUMMARY"
          if awk -v total="$total" 'BEGIN { exit !(total + 0 < 70) }'; then
            echo "::error::Coverage ${total}% is below 70%"
            exit 1
          fi

      - name: ⬆️ Upload coverage artifact
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage.out

  security:
    name: 🛡 Security
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: 📥 Checkout Source Code (full history for secret scanning)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 🛠 Setup Go (from go.mod) with cache
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      # Fails only on vulnerabilities in code the application actually calls.
      - name: 🔍 Scan dependencies for known vulnerabilities (govulncheck)
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.8.0 ./...

      # Same version as the pre-commit hook in .pre-commit-config.yaml.
      - name: 🔑 Scan git history for secrets (gitleaks)
        run: docker run --rm -v "$PWD:/repo" ghcr.io/gitleaks/gitleaks:v8.30.1 git --no-banner /repo

  integration:
    name: 🗄 Integration (MySQL)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: golang_cms
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -proot"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20
    env:
      DB_HOST: 127.0.0.1
      DB_PORT: "3306"
      DB_USERNAME: root
      DB_PASSWORD: root
      DB_DATABASE: golang_cms
      PORT: "3000"
      STAGE: ci
      TRUSTED_PROXIES: ""
    steps:
      - name: 📥 Checkout Source Code
        uses: actions/checkout@v4

      - name: 🛠 Setup Go (from go.mod) with cache
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      # Random per run, so no key is ever committed.
      - name: 🔑 Generate throwaway secrets
        run: |
          echo "JWT_KEY=$(openssl rand -hex 32)" >> "$GITHUB_ENV"
          echo "SETTINGS_ENCRYPTION_KEY=$(openssl rand -hex 32)" >> "$GITHUB_ENV"

      - name: 🗄 Apply migrations, seed and smoke test the API
        run: scripts/smoke-test.sh

  docker:
    name: 🐳 Docker Build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: 📥 Checkout Source Code
        uses: actions/checkout@v4

      - name: 🐳 Build image (not pushed)
        run: docker build -t golang-cms:${{ github.sha }} .

      - name: 📄 Check the image contains the migrations and API docs
        run: |
          docker run --rm --entrypoint ls golang-cms:${{ github.sha }} \
            internal/database/migrations/000001_create_users_table.up.sql docs/swagger.json docs/swagger.html
