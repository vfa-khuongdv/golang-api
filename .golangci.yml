version: "2"

run:
  timeout: 7m

linters:
  enable:
    - gosec
  exclusions:
    paths:
      - cmd/
      - docs/
      - tests/
    rules:
      # Tests use fixed fake credentials and small int conversions on purpose.
      - path: _test\.go
        linters:
          - gosec

formatters:
  enable:
    - gofmt
  exclusions:
    paths:
      - docs/
